[project]
name = "nexow-shared"
version = "0.1.0"
description = "Shared Python package for Nexow microservices"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.0",
    "redis>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexow_shared"]

[tool.ruff]
line-length = 100
target-version = "py311"
